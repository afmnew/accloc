<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --ink: #0e2918;
    --muted: #3b6b4e;
    --line: #c2dec9;
    --bg: #eef7f0;
    --card: #eddadc;
    --accent: #198754;
    --accent-hover: #146c43;
    --ok: #137a45;
    --okbg: #d8f3e5;
    --bad: #2e6644;
    --badbg: #e2f0e7;
    --wait: #38761d;
    --waitbg: #e9f5e1;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5; display: flex; justify-content: center; align-items: flex-start;
  }
  .card { 
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); 
    border-radius: var(--radius); padding: 22px; margin: auto; box-shadow: 0 4px 14px rgba(25, 135, 84, 0.08);
  }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--ink); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 5px; color: var(--ink); }
  .hint { font-weight: 400; color: var(--muted); }
  input, select { 
    width: 100%; padding: 11px 12px; font-size: 16px; color: var(--ink); background: #fff; 
    border: 1px solid var(--line); border-radius: 8px; 
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button { 
    width: 100%; margin-top: 14px; padding: 13px; font-size: 16px; font-weight: 600; 
    color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; 
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #9bbfa6; cursor: not-allowed; }
  button.link { background: none; color: var(--accent); border: 1px solid var(--line); margin-top: 10px; }
  button.link:hover { background: #eef7f0; }
  .pill { display: flex; gap: 9px; align-items: center; font-size: 14px; padding: 10px 12px; border-radius: 8px; margin-top: 16px; }
  .pill.ok { background: var(--okbg); color: var(--ok); }
  .pill.bad { background: var(--badbg); color: var(--bad); }
  .pill.wait { background: var(--waitbg); color: var(--wait); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .pill.wait .dot { animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .msg { font-size: 14px; margin-top: 16px; text-align: center; min-height: 20px; font-weight: 500; }
  #qrbox { display: none; margin-top: 20px; text-align: center; }
  #qrcode { display: flex; justify-content: center; padding: 14px 0; }
  .window { font-size: 14px; color: var(--muted); background: #f2faf4; border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: left; }
  .urlbox { font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 10px; }
  .session-card {
    background: #f7fbf8; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- TEACHER VIEW -->
  <div id="teacherView" hidden>
    <h1>Teacher QR Dashboard</h1>
    <p class="sub">Set optional time limits and generate attendance QRs.</p>

    <label for="sheetInput">Google Sheet Link</label>
    <input type="text" id="sheetInput" placeholder="Paste Google Sheet URL" autocomplete="off">

    <label for="startTime">Opens <span class="hint">(optional)</span></label>
    <input type="datetime-local" id="startTime">

    <label for="endTime">Closes <span class="hint">(optional)</span></label>
    <input type="datetime-local" id="endTime">

    <button id="genBtn">Create / Update QR</button>

    <!-- Active QR Box -->
    <div id="qrbox">
      <h2 id="activeSheetName" style="font-size: 17px; margin: 10px 0 6px; color: var(--ink);"></h2>
      <div id="qrcode"></div>
      <div class="window" id="windowInfo"></div>
      <div class="urlbox" id="studentLink"></div>
      <button class="link" id="copyBtn">Copy Student Link</button>
    </div>

    <!-- Saved Sheets List -->
    <label style="margin-top: 28px;">Saved Sheets:</label>
    <div id="sessionsList" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;"></div>
  </div>

  <!-- STUDENT VIEW -->
  <div id="studentView" hidden>
    <h1>Record Attendance</h1>
    <p class="sub" id="sessionSub">Checking session status…</p>

    <form id="form" novalidate>
      <label for="studentId">Student ID</label>
      <input type="text" id="studentId" inputmode="numeric" required autocomplete="off">

      <label for="name">Full Name (Arabic)</label>
      <input type="text" id="name" dir="rtl" minlength="3" required>

      <label for="groupSelect">Group</label>
      <select id="groupSelect" required>
        <option value="" disabled selected>Select group</option>
        <optgroup label="A"><option>A1</option><option>A2</option><option>A3</option><option>A4</option><option>A5</option><option>A6</option></optgroup>
        <optgroup label="B"><option>B1</option><option>B2</option><option>B3</option><option>B4</option><option>B5</option><option>B6</option></optgroup>
        <optgroup label="C"><option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option><option>C6</option></optgroup>
      </select>

      <div class="pill wait" id="locPill">
        <span class="dot"></span><span id="locText">Finding your location…</span>
      </div>
      <button class="link" id="retryLoc" type="button" hidden>Retry Location</button>

      <button type="submit" id="submitBtn" disabled>Submit Attendance</button>
    </form>

    <p class="msg" id="msg"></p>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKG6idn096__OcYIu7NsHXAMF8Sv7VqQEnPzigr19dXhkLzLQScp17gj9yKJW75PkFHw/exec";

const params  = new URLSearchParams(location.search);
const sheetId = params.get("sheetId");
const $ = id => document.getElementById(id);

if (sheetId) {
  $("studentView").hidden = false;
  startStudent();
} else {
  $("teacherView").hidden = false;
  startTeacher();
}

/* ================= TEACHER LOGIC ================= */

function getSavedSheets() {
  try {
    return JSON.parse(localStorage.getItem("att_sheets_library") || "[]");
  } catch (e) {
    return [];
  }
}

function saveSheets(list) {
  localStorage.setItem("att_sheets_library", JSON.stringify(list));
}

function extractSheetId(v) {
  const m = v.match(/\/d\/([a-zA-Z0-9-_]{20,})/);
  return m ? m[1] : v.trim();
}

function startTeacher() {
  renderSavedSheets();

  $("genBtn").addEventListener("click", async () => {
    const raw = $("sheetInput").value.trim();
    if (!raw) return alert("Please paste the Google Sheet URL.");

    const id = extractSheetId(raw);
    const sVal = $("startTime").value;
    const eVal = $("endTime").value;
    let start = 0, end = 0;

    if (sVal && eVal) {
      start = new Date(sVal).getTime();
      end = new Date(eVal).getTime();
      if (isNaN(start) || isNaN(end)) return alert("Invalid date/time.");
      if (end <= start) return alert("Closing time must be after opening time.");
    } else if (sVal || eVal) {
      return alert("Specify both start and end time, or leave both empty for no limit.");
    }

    const btn = $("genBtn");
    btn.disabled = true;
    btn.textContent = "Connecting to Sheet…";

    try {
      const url = `${APPS_SCRIPT_URL}?action=create&sheetId=${encodeURIComponent(id)}&start=${start}&end=${end}`;
      const r = await fetch(url, { redirect: "follow" });
      const rawText = await r.text();

      let res;
      try {
        res = JSON.parse(rawText);
      } catch (jsonErr) {
        throw new Error("Could not parse response from server. Check script permissions.");
      }

      if (res.status === "error") throw new Error(res.message);

      const library = getSavedSheets();
      const existingIdx = library.findIndex(item => item.id === id);
      const sheetData = {
        id: id,
        title: res.title,
        start: start,
        end: end
      };

      if (existingIdx > -1) {
        library[existingIdx] = sheetData;
      } else {
        library.unshift(sheetData);
      }
      saveSheets(library);

      displayQR(sheetData);
      renderSavedSheets();
      $("sheetInput").value = "";
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Create / Update QR";
    }
  });

  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("copyBtn").dataset.url || "").then(() => {
      $("copyBtn").textContent = "Copied!";
      setTimeout(() => $("copyBtn").textContent = "Copy Student Link", 1500);
    });
  });
}

function renderSavedSheets() {
  const container = $("sessionsList");
  const list = getSavedSheets();
  container.innerHTML = "";

  if (list.length === 0) {
    container.innerHTML = `<p style="font-size: 13px; color: var(--muted); margin: 0;">No sheets saved yet. Generate one above.</p>`;
    return;
  }

  list.forEach((item, index) => {
    const el = document.createElement("div");
    el.className = "session-card";

    let timeText = "No time limit (Always Open)";
    if (item.start && item.end) {
      timeText = `${new Date(item.start).toLocaleDateString([], {month:'short', day:'numeric'})}: `
               + `${new Date(item.start).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} – `
               + `${new Date(item.end).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }

    el.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <strong style="color:var(--ink); font-size:15px;">${item.title}</strong>
          <div style="font-size:12px; color:var(--muted); margin-top:2px;">${timeText}</div>
        </div>
        <button style="width:auto; margin:0; padding:4px 8px; font-size:12px; background:none; color:var(--bad); border:1px solid var(--line);" onclick="deleteSheet(${index})">✕</button>
      </div>
      <button style="margin-top:6px; padding:9px; font-size:13px;" onclick="selectSavedSheet('${item.id}')">View QR Code</button>
    `;
    container.appendChild(el);
  });
}

function selectSavedSheet(id) {
  const item = getSavedSheets().find(s => s.id === id);
  if (item) displayQR(item);
}

function displayQR(item) {
  const studentUrl = `${location.origin}${location.pathname}?sheetId=${encodeURIComponent(item.id)}`;
  $("activeSheetName").textContent = item.title;

  let info = "No time limit — always accepting responses.";
  if (item.start && item.end) {
    info = `Opens: ${new Date(item.start).toLocaleString([], {dateStyle:'short', timeStyle:'short'})}<br>`
         + `Closes: ${new Date(item.end).toLocaleString([], {dateStyle:'short', timeStyle:'short'})}`;
  }

  $("qrcode").innerHTML = "";
  new QRCode($("qrcode"), { text: studentUrl, width: 200, height: 200 });
  $("windowInfo").innerHTML = info;
  $("studentLink").textContent = studentUrl;
  $("copyBtn").dataset.url = studentUrl;
  $("qrbox").style.display = "block";
  $("qrbox").scrollIntoView({ behavior: "smooth" });
}

function deleteSheet(index) {
  if (!confirm("Remove this sheet from your list?")) return;
  const list = getSavedSheets();
  list.splice(index, 1);
  saveSheets(list);
  renderSavedSheets();
}

/* ================= STUDENT LOGIC ================= */

let fix = null;
let sessionOpen = false;
let watchId = null;

function getDeviceUuid() {
  let u = localStorage.getItem("att_device_uuid");
  if (!u) {
    u = (window.crypto && crypto.randomUUID) 
      ? crypto.randomUUID() 
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    localStorage.setItem("att_device_uuid", u);
  }
  return u;
}

function setPill(kind, text) {
  $("locPill").className = "pill " + kind;
  $("locText").textContent = text;
}

function updateSubmitState() {
  $("submitBtn").disabled = !(fix && sessionOpen);
}

// GPS Refinement via watchPosition + cached instant unlock
function startLocation() {
  if (!navigator.geolocation) {
    setPill("bad", "Geolocation is not supported by your browser.");
    return;
  }

  setPill("wait", "Acquiring GPS location…");
  $("retryLoc").hidden = true;

  if (watchId !== null) navigator.geolocation.clearWatch(watchId);

  // Fallback: If indoors and takes longer than 6 seconds, accept best available fix
  const fallbackTimer = setTimeout(() => {
    if (fix) {
      setPill("ok", "Location ready");
      updateSubmitState();
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    }
  }, 6000);

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const candidate = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy
      };

      if (!fix || candidate.acc <= fix.acc) {
        fix = candidate;
      }

      setPill("ok", "Location ready");
      updateSubmitState();

      // If accuracy reaches realistic indoor precision (<= 65m), stop listening
      if (fix.acc <= 65) {
        clearTimeout(fallbackTimer);
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    },
    err => {
      if (!fix) {
        setPill("bad", "Location access needed. Turn on GPS and allow access.");
        $("retryLoc").hidden = false;
        updateSubmitState();
      }
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function checkSession() {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=session&sheetId=${encodeURIComponent(sheetId)}`, { redirect: "follow" });
    const data = await res.json();

    if (data.status === "open") {
      sessionOpen = true;
      $("sessionSub").textContent = "Session is active.";
    } else {
      sessionOpen = false;
      $("sessionSub").textContent = data.message || "Attendance is currently closed.";
      $("form").hidden = true;
      showMsg(data.message || "Attendance is closed.", "bad");
    }
  } catch (e) {
    sessionOpen = true;
    $("sessionSub").textContent = "Fill details and submit.";
  }
  updateSubmitState();
}

function showMsg(text, kind) {
  const m = $("msg");
  m.textContent = text;
  m.style.color = kind === "ok" ? "var(--ok)" : "var(--bad)";
}

function startStudent() {
  startLocation();
  checkSession();

  $("retryLoc").addEventListener("click", () => startLocation());

  $("form").addEventListener("submit", async e => {
    e.preventDefault();

    if (!fix) {
      showMsg("GPS fix required before submitting.", "bad");
      return;
    }

    const btn = $("submitBtn");
    const studentId = $("studentId").value.trim();
    const name = $("name").value.trim();
    const group = $("groupSelect").value;

    if (!studentId || name.length < 3 || !group) {
      showMsg("Please fill out all fields properly.", "bad");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Recording…";
    showMsg("", "");

    if (watchId !== null) navigator.geolocation.clearWatch(watchId);

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          sheetId: sheetId,
          studentId: studentId,
          name: name,
          group: group,
          latitude: fix.lat,
          longitude: fix.lon,
          accuracy: fix.acc,
          deviceUuid: getDeviceUuid()
        })
      });

      const res = await response.json();
      if (res.status === "success") {
        showMsg(res.message, "ok");
        $("form").hidden = true;
      } else {
        showMsg(res.message, "bad");
        // Keep button disabled if rejected permanently (duplicate, expired, or out of campus)
        const finalStatuses = ["duplicate", "duplicate_device", "expired", "not_started", "outside_geofence"];
        if (!finalStatuses.includes(res.status)) {
          btn.disabled = false;
        }
      }
    } catch (err) {
      showMsg("Network error during submission. Try again.", "bad");
      btn.disabled = false;
    } finally {
      btn.textContent = "Submit Attendance";
    }
  });
}
</script>
</body>
</html>
